backend:
  name: 'git-gateway'
  branch: 'main'

local_backend: true

media_folder: 'public/images/uploads'
public_folder: '/WebLores/images/uploads'

collections:
  - name: 'games'
    label: 'Juegos'
    label_singular: 'Juego'
    folder: 'content/games'
    create: true 
    identifier_field: 'title'
    summary: '{{title}} ({{genre}})'
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Slug (URL)', name: 'slug', widget: 'string', hint: 'Ej: hollow-knight' }
      - { label: 'Portada', name: 'cover', widget: 'image' }
      - { label: 'Descripción', name: 'description', widget: 'text' }
      - { label: 'Año', name: 'year', widget: 'number', value_type: 'int' }
      - { label: 'Desarrollador', name: 'developer', widget: 'string' }
      - { label: 'Género', name: 'genre', widget: 'string' }
      - { label: 'Color del tema (hex)', name: 'themeColor', widget: 'string', default: '#8b5cf6' }
      - { label: 'Cuerpo (Lore)', name: 'body', widget: 'markdown' }

  - name: 'characters'
    label: 'Personajes'
    label_singular: 'Personaje'
    folder: 'content/characters'
    create: true
    nested:
      depth: 2
    path: '{{fields.game}}/{{fields.slug}}'
    identifier_field: 'name'
    summary: '{{name}} — {{role}}'
    fields:
      - { label: 'Nombre', name: 'name', widget: 'string' }
      - { label: 'Slug (URL)', name: 'slug', widget: 'string', hint: 'Ej: hornet' }
      - { label: 'Juego (slug)', name: 'game', widget: 'string', hint: 'Ej: hollow-knight' }
      - { label: 'Rol', name: 'role', widget: 'string' }
      - { label: 'Facción', name: 'faction', widget: 'string' }
      - { label: 'Cita', name: 'quote', widget: 'text' }
      - { label: 'Retrato', name: 'cover', widget: 'image' }
      - { label: 'Galería', name: 'gallery', widget: 'list', required: false, field: { label: 'Imagen', name: 'image', widget: 'image' } }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false, default: [] }
      - { label: 'Orden', name: 'order', widget: 'number', value_type: 'int', default: 1 }
      - { label: 'Color del tema (hex)', name: 'themeColor', widget: 'string', default: '#8b5cf6' }
      - { label: 'Cuerpo (Lore)', name: 'body', widget: 'markdown' } 